basePath: /
definitions:
  handler.AddMemberRequest:
    properties:
      cpsGpfNumber:
        type: string
      dateOfBirth:
        type: string
      designation:
        type: string
      educationalQualification:
        type: string
      email:
        type: string
      fatherName:
        type: string
      gender:
        type: string
      id:
        type: string
      initial:
        type: string
      mobileNumber:
        type: string
      motherName:
        type: string
      name:
        type: string
      nativeDistrict:
        type: string
      permanentAddress:
        type: string
      recruitmentBatch:
        type: string
      residentialAddress:
        type: string
      seniorityNumber:
        type: string
      tagaId:
        type: string
      tbfNumber:
        type: string
      workingDistrict:
        type: string
    required:
    - dateOfBirth
    - designation
    - educationalQualification
    - email
    - gender
    - initial
    - mobileNumber
    - name
    - nativeDistrict
    - tagaId
    - workingDistrict
    type: object
  handler.AdminLoginRequest:
    properties:
      password:
        example: admin123
        type: string
      username:
        example: admin@taga.com
        type: string
    required:
    - password
    - username
    type: object
  handler.AdminLoginResponse:
    properties:
      expires_in:
        type: integer
      role:
        type: string
      token:
        type: string
    type: object
  handler.AnnouncementRequest:
    properties:
      district:
        type: string
      message:
        type: string
      priority:
        type: string
      sendTo:
        type: string
      title:
        type: string
    required:
    - message
    - title
    type: object
  handler.AnnouncementResponse:
    properties:
      announcement_id:
        type: string
      message:
        type: string
      recipients:
        type: integer
      send_to:
        type: string
    type: object
  handler.BulkUploadFailure:
    properties:
      email:
        type: string
      errors:
        items:
          type: string
        type: array
      row_number:
        type: integer
    type: object
  handler.BulkUploadResult:
    properties:
      failed:
        items:
          $ref: '#/definitions/handler.BulkUploadFailure'
        type: array
      failed_count:
        type: integer
      processed_at:
        type: string
      success_count:
        type: integer
      total_count:
        type: integer
    type: object
  handler.CreateOrderResponse:
    properties:
      key:
        type: string
      order:
        additionalProperties: true
        type: object
    type: object
  handler.DistrictBearer:
    properties:
      contact:
        type: string
      department:
        type: string
      name:
        type: string
      title:
        type: string
    type: object
  handler.MemberListItem:
    properties:
      designation:
        type: string
      district:
        type: string
      email:
        type: string
      gender:
        type: string
      id:
        type: string
      initial:
        type: string
      membership_status:
        type: string
      mobile_number:
        type: string
      name:
        type: string
      payment_status:
        type: string
      recruitment_batch:
        type: string
      tagaId:
        type: string
    type: object
  handler.MemberListResponse:
    properties:
      limit:
        type: integer
      members:
        items:
          $ref: '#/definitions/handler.MemberListItem'
        type: array
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  handler.MemberLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handler.MemberLoginResponse:
    properties:
      expires_in:
        type: integer
      forceChangePassword:
        type: boolean
      role:
        type: string
      token:
        type: string
      user: {}
    type: object
  handler.StateExecutive:
    properties:
      description:
        type: string
      designation:
        type: string
      experience:
        type: integer
      image:
        description: optional
        type: string
      location:
        type: string
      name:
        type: string
      phone:
        type: string
      qualification:
        type: string
      sno:
        type: integer
    type: object
  handler.SubscriptionPlanResponse:
    properties:
      allowCustomAmount:
        type: boolean
      amount:
        type: number
      description:
        type: string
      frequency:
        type: string
      id:
        type: string
      lastPaidDate:
        type: string
      name:
        type: string
      needBased:
        type: boolean
      nextDueDate:
        type: string
      oneTime:
        type: boolean
      status:
        type: string
    type: object
  handler.UpdateMemberRequest:
    properties:
      cps_gpf_number:
        type: string
      date_of_birth:
        type: string
      designation:
        type: string
      educational_qualification:
        type: string
      emailId:
        type: string
      father_name:
        type: string
      gender:
        type: string
      initial:
        type: string
      mobile_number:
        type: string
      mother_name:
        type: string
      name:
        type: string
      native_district:
        type: string
      permanent_address:
        type: string
      recruitment_batch:
        type: string
      residential_address:
        type: string
      seniority_number:
        type: string
      tbf_number:
        type: string
      working_district:
        type: string
    type: object
  model.AboutResponse:
    properties:
      acronym:
        type: string
      description:
        type: string
      established_year:
        type: integer
      hero_image_url:
        type: string
      id:
        type: integer
      mission:
        type: string
      name:
        type: string
      tagline:
        type: string
      vision:
        type: string
    type: object
  model.BookingFor:
    enum:
    - self
    - guest
    type: string
    x-enum-varnames:
    - BookingForSelf
    - BookingForGuest
  model.BookingResponse:
    properties:
      advanceAmount:
        type: integer
      bedCount:
        type: integer
      bookerId:
        type: string
      bookerName:
        type: string
      bookingFor:
        $ref: '#/definitions/model.BookingFor'
      bookingStatus:
        description: '✅ NEW: Computed booking status (upcoming, active, completed,
          cancelled)'
        type: string
      checkInDate:
        type: string
      checkOutDate:
        type: string
      gender:
        $ref: '#/definitions/model.Gender'
      guestDetails:
        items:
          $ref: '#/definitions/model.GuestDetail'
        type: array
      id:
        type: string
      paymentStatus:
        $ref: '#/definitions/model.PaymentStatus'
      roomId:
        type: string
      roomName:
        type: string
    type: object
  model.ContactResponse:
    properties:
      headquarters:
        $ref: '#/definitions/model.Headquarters'
      office_hours:
        example: |-
          Monday - Friday: 9:00 AM - 5:30 PM
          Saturday: 9:00 AM - 1:00 PM
          Sunday: Closed
        type: string
      primary_email:
        example: info@taga-tn.org
        type: string
      primary_phone:
        example: +91-422-6611-200
        type: string
      regional_offices:
        items:
          $ref: '#/definitions/model.RegionalOffice'
        type: array
      secondary_email:
        example: info2@taga-tn.org
        type: string
      website:
        example: www.taga-tn.org
        type: string
    type: object
  model.CreateBookingRequest:
    properties:
      bedCount:
        type: integer
      bookerPhone:
        type: string
      bookingFor:
        $ref: '#/definitions/model.BookingFor'
      checkInDate:
        type: string
      checkOutDate:
        description: '"2006-01-02"'
        type: string
      gender:
        $ref: '#/definitions/model.Gender'
      guestDetails:
        items:
          $ref: '#/definitions/model.GuestDetail'
        type: array
      roomId:
        type: string
      upiId:
        type: string
    required:
    - bedCount
    - bookerPhone
    - bookingFor
    - checkInDate
    - checkOutDate
    - roomId
    type: object
  model.Document:
    properties:
      category_id:
        description: links to ResourceCategory
        type: string
      subcategory:
        description: '"Central" or "State", optional'
        type: string
      title:
        type: string
      year:
        type: string
    type: object
  model.Event:
    properties:
      attendees:
        type: integer
      date:
        type: string
      description:
        type: string
      id:
        type: string
      location:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  model.ForgotPasswordRequest:
    properties:
      email:
        type: string
    type: object
  model.GalleryImage:
    properties:
      date:
        type: string
      event:
        type: string
      id:
        type: string
      imageUrl:
        type: string
      title:
        type: string
      year:
        type: integer
    type: object
  model.Gender:
    enum:
    - male
    - female
    type: string
    x-enum-varnames:
    - GenderMale
    - GenderFemale
  model.Grievance:
    properties:
      assignedTo:
        type: string
      category:
        type: string
      contactPhone:
        type: string
      description:
        type: string
      id:
        type: string
      lastUpdate:
        type: string
      preferredResponse:
        type: string
      priority:
        type: string
      status:
        type: string
      subject:
        type: string
      submittedDate:
        type: string
    type: object
  model.GuestDetail:
    properties:
      age:
        type: integer
      contact:
        type: string
      name:
        type: string
    type: object
  model.Headquarters:
    properties:
      address:
        example: |-
          Tamil Nadu Agricultural University Campus
          Coimbatore - 641003
          Tamil Nadu, India
        type: string
      name:
        example: TAGA Headquarters
        type: string
    type: object
  model.MemberNotification:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_read:
        type: boolean
      member_email:
        type: string
      member_id:
        type: string
      message:
        type: string
      notification_id:
        type: string
      priority:
        type: string
      read_at:
        type: string
      taga_id:
        type: string
      title:
        type: string
    type: object
  model.Membership:
    properties:
      address:
        type: string
      currentEmployment:
        type: string
      dateOfBirth:
        type: string
      district:
        type: string
      email:
        type: string
      experience:
        type: string
      firstName:
        type: string
      gender:
        type: string
      graduationYear:
        type: string
      lastName:
        type: string
      organization:
        type: string
      phone:
        type: string
      qualification:
        type: string
      references:
        type: string
      specialization:
        type: string
    type: object
  model.Objective:
    properties:
      description:
        type: string
      id:
        type: integer
      order_index:
        type: integer
      title:
        type: string
    type: object
  model.PaymentStatus:
    enum:
    - pending
    - confirmed
    - cancelled
    - refunded
    type: string
    x-enum-varnames:
    - PaymentPending
    - PaymentConfirmed
    - PaymentCancelled
    - PaymentRefunded
  model.RegionalOffice:
    properties:
      address:
        example: 123 Agricultural Complex, GST Road, Chennai - 600032
        type: string
      city:
        example: Chennai
        type: string
      id:
        example: 1
        type: integer
      phone:
        example: +91-44-2345-6789
        type: string
    type: object
  model.ResetPasswordRequest:
    properties:
      email:
        type: string
      new_password:
        type: string
      old_password:
        type: string
    type: object
  model.ResourceCategory:
    properties:
      id:
        type: string
      name:
        type: string
      subcategories:
        description: e.g., ["Central", "State"]
        items:
          type: string
        type: array
    type: object
  model.Room:
    properties:
      allowSingleBed:
        type: boolean
      capacity:
        type: integer
      id:
        type: string
      name:
        type: string
      type:
        $ref: '#/definitions/model.RoomType'
    type: object
  model.RoomAvailability:
    properties:
      available:
        type: boolean
      availableBeds:
        type: integer
      genderRestriction:
        $ref: '#/definitions/model.Gender'
      room:
        $ref: '#/definitions/model.Room'
    type: object
  model.RoomType:
    enum:
    - apex-suite
    - ac-room
    - gents-dorm
    - ladies-dorm
    type: string
    x-enum-varnames:
    - RoomTypeApexSuite
    - RoomTypeACRoom
    - RoomTypeGentsDorm
    - RoomTypeLadiesDorm
  model.ServiceResponse:
    properties:
      category:
        example: member-support
        type: string
      description:
        example: Training programs, workshops, and skill enhancement opportunities
          for career growth.
        type: string
      icon_name:
        example: Users
        type: string
      id:
        example: 1
        type: integer
      title:
        example: Professional Development
        type: string
    type: object
  model.StatsResponse:
    description: Organization statistics item with label, value, and display properties
    properties:
      color_class:
        type: string
      icon_name:
        type: string
      id:
        type: integer
      label:
        type: string
      value:
        type: integer
    type: object
  office_bearers.DistrictBearer:
    properties:
      contact:
        type: string
      name:
        type: string
      title:
        type: string
    type: object
info:
  contact: {}
  description: This is the Taga API server
  title: Taga API
  version: "1.0"
paths:
  /:
    get:
      description: Returns a welcome message from the API
      produces:
      - application/json
      responses:
        "200":
          description: success response
          schema:
            additionalProperties: true
            type: object
      summary: Get welcome message
      tags:
      - general
  /api/admin/announcements/send:
    post:
      consumes:
      - application/json
      description: Send email announcement to members and store in database
      parameters:
      - description: Announcement details
        in: body
        name: announcement
        required: true
        schema:
          $ref: '#/definitions/handler.AnnouncementRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AnnouncementResponse'
      security:
      - BearerAuth: []
      summary: Send announcement to members
      tags:
      - Admin Announcements
  /api/admin/events/{id}:
    delete:
      description: Delete an event by ID
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete an event
      tags:
      - Admin Content
    put:
      consumes:
      - multipart/form-data
      description: Update an event by ID using multipart form data
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      - description: Event title
        in: formData
        name: title
        type: string
      - description: Event date (YYYY-MM-DD HH:MM)
        in: formData
        name: date
        type: string
      - description: Event location
        in: formData
        name: location
        type: string
      - description: Event description
        in: formData
        name: description
        type: string
      - description: Event status (upcoming/ongoing/completed/cancelled)
        in: formData
        name: status
        type: string
      - description: Replacement event image
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update an existing event
      tags:
      - Admin Content
  /api/admin/events/create:
    post:
      consumes:
      - multipart/form-data
      description: Create a new event with optional image upload
      parameters:
      - description: Event title
        in: formData
        name: title
        required: true
        type: string
      - description: Event date (YYYY-MM-DD HH:MM)
        in: formData
        name: date
        required: true
        type: string
      - description: Event location
        in: formData
        name: location
        type: string
      - description: Event description
        in: formData
        name: description
        type: string
      - description: Event status (upcoming/past/completed)
        in: formData
        name: status
        type: string
      - description: Number of attendees
        in: formData
        name: attendees
        type: integer
      - description: Event image file
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a new event
      tags:
      - Admin Content
  /api/admin/gallery/{id}:
    delete:
      description: Remove an image from the gallery by ID
      parameters:
      - description: Gallery image ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a gallery image
      tags:
      - Admin Content
  /api/admin/gallery/upload:
    post:
      consumes:
      - multipart/form-data
      description: Add a new image to the photo gallery
      parameters:
      - description: Image title
        in: formData
        name: title
        required: true
        type: string
      - description: Event name
        in: formData
        name: event
        required: true
        type: string
      - description: Date (YYYY-MM-DD)
        in: formData
        name: date
        required: true
        type: string
      - description: Year
        in: formData
        name: year
        required: true
        type: integer
      - description: Image file (JPEG/PNG)
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Upload a gallery image
      tags:
      - Admin Content
  /api/admin/init-password:
    post:
      consumes:
      - application/json
      description: Initialize passwords for all members, a specific member, or none
        (default).
      parameters:
      - description: 'Member ID or keyword: all | none (default)'
        in: query
        name: memberId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Password initialization result
          schema:
            type: string
        "400":
          description: Invalid or missing parameter
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Initialize member password(s)
      tags:
      - Admin
  /api/admin/login:
    post:
      consumes:
      - application/json
      description: Authenticates admin user and returns JWT token for subsequent API
        calls
      parameters:
      - description: Admin Login Credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/handler.AdminLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AdminLoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Admin Login
      tags:
      - Admin Authentication
  /api/admin/member-registration:
    post:
      consumes:
      - multipart/form-data
      description: Process new member registration file upload, validate data, store
        member details, and send email with temporary password
      parameters:
      - description: Registration file (JSON/CSV format)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Registration successful
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid file or validation errors
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Registration validation failed
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Handle new member registration
      tags:
      - Admin
  /api/admin/members:
    get:
      consumes:
      - application/json
      description: Get paginated list of members with search and filters
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Search by name, email, mobile
        in: query
        name: search
        type: string
      - description: Filter by district
        in: query
        name: district
        type: string
      - description: Filter by payment status (paid/unpaid)
        in: query
        name: payment_status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MemberListResponse'
      security:
      - BearerAuth: []
      summary: Get list of members
      tags:
      - Admin Members
  /api/admin/members/{id}:
    delete:
      description: Admin hard-deletes a member by ID (removes from JSON)
      parameters:
      - description: Member ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a member permanently
      tags:
      - Admin Members
    put:
      consumes:
      - application/json
      description: Admin updates member details (all fields except password and TAGA
        ID)
      parameters:
      - description: Member ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated member fields
        in: body
        name: member
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateMemberRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
