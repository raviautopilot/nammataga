# --- Web Frontend: nammataga.com (Port 80 -> localhost:1701) ---
server {
    listen 80;
    server_name nammataga.com;

    location / {
        proxy_pass http://127.0.0.1:1701;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- Backend API: api.nammataga.com (Port 80 -> localhost:1801) ---
server {
    listen 80;
    server_name api.nammataga.com;

    location / {
        proxy_pass http://127.0.0.1:1801;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
