# --- HTTP (Port 80) -> Redirect to HTTPS ---
server {
    listen 80;
    server_name nammataga.com api.nammataga.com;
    return 301 https://$host$request_uri;
}

# --- HTTPS (Port 443) - Web Frontend: nammataga.com -> localhost:1701 ---
server {
    listen 443 ssl;
    server_name nammataga.com;

    ssl_certificate /etc/ssl/certs/nammataga.crt;
    ssl_certificate_key /etc/ssl/private/nammataga.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:1701;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- HTTPS (Port 443) - Backend API: api.nammataga.com -> localhost:1801 ---
server {
    listen 443 ssl;
    server_name api.nammataga.com;

    ssl_certificate /etc/ssl/certs/nammataga.crt;
    ssl_certificate_key /etc/ssl/private/nammataga.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:1801;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
